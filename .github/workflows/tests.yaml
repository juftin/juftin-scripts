name: Tests

on:
    push:
        branches:
        -   main
        paths:
        -   juftin_scripts/**
        -   pyproject.toml
        -   .github/workflows/tests.yaml
    pull_request:
        branches: ['**']
        paths:
        -   juftin_scripts/**
        -   pyproject.toml
        -   .github/workflows/tests.yaml
    schedule:
    -   cron: 0 12 1 * *
jobs:
    test-suite:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                include:
                -   {name: Python 3.15, python: '3.15', tox: py315}
                -   {name: Python 3.14, python: '3.14', tox: py314}
                -   {name: Python 3.13, python: '3.13', tox: py313}
                -   {name: Python 3.12, python: '3.12', tox: py312}
                -   {name: Python 3.11, python: '3.11', tox: py311}
        steps:
        -   name: Set up Github Workspace
            uses: actions/checkout@v3
            with:
                fetch-depth: 0
        -   name: Set up Python Environment ${{ matrix.python }}
            uses: actions/setup-python@v4
            with:
                python-version: ${{ matrix.python }}
        -   name: Install Test Dependencies
            run: |
                python -m pip install --upgrade pip wheel setuptools
                python -m pip install tox
        -   name: Tox Test Suite
            run: |
                echo "::add-matcher::.github/matchers/python.json"
                tox -e ${{ matrix.tox }}
                echo "::remove-matcher owner=python::"
